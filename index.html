<!doctype html>
<html lang="es">
<head>

  <style>

    .wrap{max-width:900px;margin:48px auto;padding:0 20px}

    .links{display:grid;gap:12px;margin:18px 0 6px}

      padding:14px 16px;border-radius:12px;border:1px solid #2a2f3c;text-decoration:none;color:var(--txt)}
    a.btn:hover{border-color:#3b4356;transform:translateY(-1px)}
    small{color:var(--muted)}
    ul{margin:10px 0 0 18px;color:var(--muted)}
    .badge{font-size:12px;padding:2px 8px;border:1px solid #3b4356;border-radius:999px}
  </style>
</head>
